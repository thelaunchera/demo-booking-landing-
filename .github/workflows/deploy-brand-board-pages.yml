name: Deploy Brand Board Studio, AFTR and Jaramillo to GitHub Pages
# Jaramillo Boutique: publish current approved Bodoni Moda/DM Sans typography from demo/jaramillo-boutique (2026-11-07).
# Jaramillo Boutique: deploy full-width hero caption + simplified story bar (2026-11-07).

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-brand-board-pages.yml
      - assets/tle-demo-mobile-ux-20261107.css
      - assets/tle-demo-single-signature-20261108.css
      # TLE multi-brand unique galleries / November 2026
      - assets/tle-unique-galleries-20261107.css
      - assets/tle-unique-galleries-20261107.js
      - demos/yummm/**
      - demos/soluna-yoga/**
      - demos/lavender-edit/**
      - demos/wok-social/**
      - demos/seasonal-brew/**
  workflow_run:
    workflows:
      - Build Brand Board Studio
    types:
      - completed
    branches:
      - brand-board-studio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-brand-and-aftr
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout Brand Board Studio source
        uses: actions/checkout@v4
        with:
          ref: brand-board-studio
          path: brand-source

      - name: Checkout Jaramillo Boutique demo source
        uses: actions/checkout@v4
        with:
          ref: demo/jaramillo-boutique
          path: boutique-source
          persist-credentials: false

      - name: Checkout existing AFTR GitHub Pages files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: brand-source
        run: npm install --no-audit --no-fund

      - name: Build Brand Board Studio
        working-directory: brand-source
        run: npm run build

      - name: Merge application with existing AFTR website
        run: |
          rm -rf _site/.git
          rm -rf _site/brand-board-studio
          mkdir -p _site/brand-board-studio
          cp -R brand-source/dist/. _site/brand-board-studio/
          rm -rf _site/yummm
          mkdir -p _site/yummm
          cp -R demos/yummm/. _site/yummm/
          rm -rf _site/soluna-yoga
          mkdir -p _site/soluna-yoga
          cp -R demos/soluna-yoga/. _site/soluna-yoga/
          rm -rf _site/lavender-edit
          mkdir -p _site/lavender-edit
          cp -R demos/lavender-edit/. _site/lavender-edit/
          rm -rf _site/wok-social
          mkdir -p _site/wok-social
          cp -R demos/wok-social/. _site/wok-social/
          rm -rf _site/seasonal-brew
          mkdir -p _site/seasonal-brew
          cp -R demos/seasonal-brew/. _site/seasonal-brew/
          # Shared The Launch Era footer/focus layer, kept separate from each demo's visual identity
          mkdir -p _site/assets
          cp assets/tle-company-system-20261106.css _site/assets/tle-company-system-20261106.css
          cp assets/tle-demo-mobile-ux-20261107.css _site/assets/tle-demo-mobile-ux-20261107.css
          cp assets/tle-demo-single-signature-20261108.css _site/assets/tle-demo-single-signature-20261108.css
          cp assets/tle-unique-galleries-20261107.css _site/assets/tle-unique-galleries-20261107.css
          cp assets/tle-unique-galleries-20261107.js _site/assets/tle-unique-galleries-20261107.js
          node --check _site/assets/tle-unique-galleries-20261107.js
          test -s _site/assets/tle-unique-galleries-20261107.css
          test -s _site/assets/tle-demo-mobile-ux-20261107.css
          test -s _site/assets/tle-demo-single-signature-20261108.css
          test -s _site/jaramillo-boutique/single-signature-20261108.css
          grep -q 'data-tle-one-motion="jaramillo-boutique"' _site/jaramillo-boutique/index.html
          for demo in yummm soluna-yoga wok-social seasonal-brew; do grep -q "data-tle-one-motion=\\\"$demo\\\"" "_site/$demo/index.html"; done
          test -s _site/assets/tle-company-system-20261106.css
          grep -q '../assets/tle-company-system-20261106.css' _site/wok-social/index.html
          rm -rf _site/jaramillo-boutique
          mkdir -p _site/jaramillo-boutique
          cp -R boutique-source/demos/jaramillo-boutique/. _site/jaramillo-boutique/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/aftr-nightclub/index.html
          test -s _site/aftr-nightclub/styles.css
          grep -q 'AFTR editorial signature' _site/aftr-nightclub/styles.css
          test -f _site/brand-board-studio/index.html
          test -f _site/yummm/index.html
          test -s _site/yummm/styles.css
          node --check _site/yummm/script.js
          grep -q 'id="headerBox"' _site/yummm/index.html
          grep -q 'id="headerBoxCount"' _site/yummm/index.html
          ! grep -Fq '$$$(' _site/yummm/script.js
          test -f _site/soluna-yoga/index.html
          grep -q 'id="signupForm"' _site/soluna-yoga/index.html
          grep -q 'data-plan="Flow"' _site/soluna-yoga/index.html
          test -s _site/lavender-edit/index.html
          test -s _site/lavender-edit/assets/01_Soft_Lavender_Hero.png
          test -s _site/lavender-edit/assets/08_After_Hours.png
          grep -q 'The Lavender Edit' _site/lavender-edit/index.html
          test -s _site/wok-social/index.html
          test -s _site/seasonal-brew/index.html
          test -s _site/seasonal-brew/styles.css
          test -s _site/seasonal-brew/app.js
          node --check _site/seasonal-brew/app.js
          test -s _site/seasonal-brew/assets/storefront.webp
          test -s _site/seasonal-brew/assets/sugar-cookie.webp
          test -s _site/seasonal-brew/assets/seasonal-drinks.webp
          grep -q 'Seasonal Brew' _site/seasonal-brew/index.html
          grep -q 'tle-unique-galleries-20261107.js' _site/yummm/index.html
          grep -q 'tle-unique-galleries-20261107.js' _site/seasonal-brew/index.html
          grep -q 'tle-unique-galleries-20261107.js' _site/soluna-yoga/index.html
          grep -q 'tle-unique-galleries-20261107.js' _site/wok-social/index.html
          grep -q 'tle-unique-galleries-20261107.css' _site/yummm/index.html
          test -s _site/wok-social/styles.css
          test -s _site/wok-social/script.js
          test -s _site/wok-social/favicon.svg
          test -s _site/wok-social/food-placeholder.svg
          node --check _site/wok-social/script.js
          grep -q 'WOK SOCIAL' _site/wok-social/index.html
          test -f _site/jaramillo-boutique/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/jaramillo-boutique/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/wok-social/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/seasonal-brew/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/soluna-yoga/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/lavender-edit/index.html
          grep -q 'tle-demo-mobile-ux-20261107.css' _site/yummm/index.html
          test -f _site/jaramillo-boutique/styles.css
          test -f _site/jaramillo-boutique/main.js
          test -f _site/jaramillo-boutique/assets/model-cutout.webp
          test -f _site/jaramillo-boutique/assets/designer-real.webp
          test -d _site/brand-board-studio/assets

      - name: Smoke-test Jaramillo Boutique preview
        run: |
          node --check _site/jaramillo-boutique/main.js
          test -s _site/jaramillo-boutique/cata-editorial.css
          grep -q 'Tablet-only hero' _site/jaramillo-boutique/cata-editorial.css
          grep -q 'tablet-catalog-02' _site/jaramillo-boutique/index.html
          test -s _site/jaramillo-boutique/tablet-refinement.css
          grep -q 'Replace three cramped instructional cards' _site/jaramillo-boutique/tablet-refinement.css
          grep -q 'preserve every shoe' _site/jaramillo-boutique/tablet-refinement.css
          grep -q 'Heels & shoes' _site/jaramillo-boutique/main.js
          test -s _site/jaramillo-boutique/boutique-soft-polish.css
          grep -q 'img src="assets/noche.webp"' _site/jaramillo-boutique/index.html
          ! grep -q 'img src="assets/designer-real.webp"' _site/jaramillo-boutique/index.html
          grep -q "image:'assets/corse.webp'" _site/jaramillo-boutique/main.js
          grep -q 'boutique-soft-polish.css?v=20261101-rounded-collection05' _site/jaramillo-boutique/index.html
          grep -q 'grid-template-rows:205px' _site/jaramillo-boutique/boutique-soft-polish.css
          grep -q 'border-radius:var(--jb-soft-radius)' _site/jaramillo-boutique/boutique-soft-polish.css
          grep -q 'Collection finishing: rounded taps' _site/jaramillo-boutique/boutique-soft-polish.css
          test "$(grep -o '<article class="collection-item"' _site/jaramillo-boutique/index.html | wc -l | tr -d ' ')" = "8"
          ! grep -q 'href="assets/sandalias.webp"' _site/jaramillo-boutique/index.html
          grep -q 'concept-bag-v2' _site/jaramillo-boutique/shopping.js
          grep -q '01 / WHAT ARE YOU WEARING' _site/jaramillo-boutique/index.html
          grep -q '02 / THE WOMAN BEHIND THE EDIT' _site/jaramillo-boutique/index.html
          grep -q 'Plans tonight?' _site/jaramillo-boutique/main.js
          grep -q 'storeReason:' _site/jaramillo-boutique/main.js
          node --check _site/jaramillo-boutique/editorial-type-v5.js
          test -s _site/jaramillo-boutique/editorial-type-v5.css
          ! grep -q 'jaramilloHaloFix' _site/jaramillo-boutique/index.html
          grep -q 'V6: photography fills' _site/jaramillo-boutique/editorial-type-v5.css
          node --check _site/jaramillo-boutique/shopping.js
          node --check _site/jaramillo-boutique/boutique-real.js
          test -s _site/jaramillo-boutique/boutique-real.css
          grep -q 'id="inquiryForm"' _site/jaramillo-boutique/index.html
          grep -q 'id="bagShare"' _site/jaramillo-boutique/index.html
          grep -q 'id="shopGuide"' _site/jaramillo-boutique/index.html
          grep -q 'id="help"' _site/jaramillo-boutique/index.html
          grep -q 'id="contact"' _site/jaramillo-boutique/index.html
          grep -q 'UNIT_PRICE = 45' _site/jaramillo-boutique/shopping.js
          grep -q 'productUnitPrice' _site/jaramillo-boutique/index.html
          grep -q 'bagSubtotal' _site/jaramillo-boutique/index.html
          ! grep -q 'filter:url(#jaramilloHaloFix)' _site/jaramillo-boutique/editorial-type-v5.css
          test -s _site/jaramillo-boutique/shopping.css
          grep -q 'id="bagTrigger"' _site/jaramillo-boutique/index.html
          grep -q 'id="bagDialog"' _site/jaramillo-boutique/index.html
          grep -q 'class="top-shell"' _site/jaramillo-boutique/index.html
          test -s _site/jaramillo-boutique/assets/colombian-jeans.webp
          test -s _site/jaramillo-boutique/assets/fajas.webp
          test -s _site/jaramillo-boutique/assets/noche.webp
          test -s _site/jaramillo-boutique/assets/plataformas.webp
          test -s _site/jaramillo-boutique/assets/sandalias.webp
          test -s _site/jaramillo-boutique/assets/model-cutout.webp
          test -s _site/jaramillo-boutique/assets/designer-real.webp
          test -s _site/jaramillo-boutique/editorial-hero.css
          test -s _site/jaramillo-boutique/editorial-banner.css
          test -s _site/jaramillo-boutique/editorial-lookbook.css
          grep -q 'brand-story-banner' _site/jaramillo-boutique/index.html
          grep -q 'storyTexts' _site/jaramillo-boutique/main.js
          node --check _site/jaramillo-boutique/editorial-type-v5.js
          test -s _site/jaramillo-boutique/editorial-type-v5.css
          ! grep -q 'jaramilloHaloFix' _site/jaramillo-boutique/index.html
          grep -q 'hero-editorial-user.jpg' _site/jaramillo-boutique/index.html
          test -s _site/jaramillo-boutique/assets/hero-editorial-user.jpg
          test -s _site/jaramillo-boutique/hero-final-photo.css
          test -s _site/jaramillo-boutique/boutique-polish.css
          test -s _site/jaramillo-boutique/lookbook-refined.css
          grep -q 'data-editorial-look="blouses"' _site/jaramillo-boutique/index.html
          grep -q 'data-editorial-look="winter"' _site/jaramillo-boutique/index.html
          grep -q 'data-editorial-look="summer"' _site/jaramillo-boutique/index.html
          grep -q 'panelBlouses' _site/jaramillo-boutique/main.js
          grep -q 'position:relative!important' _site/jaramillo-boutique/lookbook-refined.css
          test -s _site/jaramillo-boutique/city-photos.css
          grep -q 'city-photo' _site/jaramillo-boutique/index.html
          grep -q 'Miami_waterfront_skyline' _site/jaramillo-boutique/index.html
          grep -q 'Las_Vegas_Strip_at_night_2023' _site/jaramillo-boutique/index.html
          grep -q 'The_New_York_City_Skyline_at_Dusk' _site/jaramillo-boutique/index.html
          grep -q 'jb-editorial-banner' _site/jaramillo-boutique/index.html
          grep -q 'storyBannerImage' _site/jaramillo-boutique/main.js
          grep -q 'aspect-ratio:4/5' _site/jaramillo-boutique/boutique-polish.css
          grep -q 'assets/corse.webp' _site/jaramillo-boutique/main.js
          grep -q 'assets/noche.webp' _site/jaramillo-boutique/index.html
          grep -q 'object-fit:contain' _site/jaramillo-boutique/hero-final-photo.css
          grep -q 'Playfair Display' _site/jaramillo-boutique/editorial-type-v5.css
          test -s _site/yummm/styles.css
          grep -q 'Keep the editorial logo fully visible' _site/jaramillo-boutique/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish full site on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
