name: One-time WOK SOCIAL Hibachi Photo Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wok-social-photo-repair-once.yml

permissions:
  contents: write

jobs:
  repair-one-existing-photo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Python for image correction
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Remove adjacent photo fragment and white dividers
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("demos/wok-social/assets/12-hibachi-steak.webp")
          im=Image.open(p).convert("RGB")
          w,h=im.size
          if w < 1120:
              print(f"Already clean image size {w}x{h}; skipping to keep this action idempotent.")
          elif w != 1152 or h != 1242:
              raise SystemExit(f"Unexpected source size {w}x{h}; refusing unsafe crop.")
          else:
              # The original asset inadvertently contains a 55px strip of the adjacent
              # image and white separators. Remove only that unwanted fringe.
              clean=im.crop((55,0,1134,h))
              assert clean.size == (1079,1242)
              clean.save(p,format="WEBP",quality=90,method=6)
              print(f"Corrected {p.name}: {im.size} -> {clean.size}")
          PY
      - name: Commit only repaired steak asset
        run: |
          if git diff --quiet -- demos/wok-social/assets/12-hibachi-steak.webp; then
            echo "Already fixed; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/wok-social/assets/12-hibachi-steak.webp
          git commit -m "Repair Hibachi Steak image edge without cropping chef or food"
          git pull --rebase origin main
          git push origin HEAD:main
