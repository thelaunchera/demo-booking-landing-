name: Recover stuck WOK SOCIAL Pages publishing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wok-pages-stuck-recovery-once.yml

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect specific stuck GitHub Pages deployment and cancel only if active
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const sha='c42aa0dd92effaa88b5d433346fa8f3fa209f96d';
          const base='https://api.github.com/repos/thelaunchera/demo-booking-landing-/pages/deployments/'+sha;
          const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'wok-social-pages-recovery'};
          (async()=>{
            const r=await fetch(base,{headers});
            if(r.status===404){console.log('Prior deployment is no longer present; no cancellation needed.');return;}
            const info=await r.text();
            if(!r.ok)throw Error('Could not inspect deployment: HTTP '+r.status+' '+info.slice(0,300));
            let data;try{data=JSON.parse(info)}catch{throw Error('Unexpected deployment response')}
            const status=(data.status||'').toLowerCase();
            console.log('Stuck deployment status:',status);
            if(['succeed','success','succeeded','deployment_successful','cancelled','deployment_cancelled'].includes(status)){
              console.log('Deployment is already terminal. No cancellation performed.');return;
            }
            if(!['in_progress','queued','pending','updating_pages','building','deployment_in_progress'].includes(status)){
              throw Error('Unrecognized status; refusing cancellation: '+status);
            }
            const c=await fetch(base+'/cancel',{method:'POST',headers});
            const message=await c.text();
            if(c.status!==204)throw Error('Pages cancellation failed: HTTP '+c.status+' '+message.slice(0,350));
            console.log('Cancelled only the blocking GitHub Pages deployment for '+sha);
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
