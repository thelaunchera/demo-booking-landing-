name: Build and publish Brand Board Studio

on:
  push:
    branches:
      - brand-board-studio
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-board-studio-github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish under /brand-board-studio/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brand Board Studio source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static application
        run: npm run build

      - name: Publish without deleting AFTR or other demos
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: brand-board-studio
          keep_files: true
          enable_jekyll: false
          commit_message: 'Publish Brand Board Studio website'
