name: Build Brand Board Studio

on:
  push:
    branches:
      - brand-board-studio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-board-studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brand Board Studio source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Verify GitHub Pages assets
        run: |
          test -f dist/index.html
          test -d dist/assets
