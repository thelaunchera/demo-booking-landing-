name: Publish Brand Board Studio to GitHub Pages

on:
  push:
    branches:
      - brand-board-studio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-brand-board
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish AFTR and Brand Board Studio together
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}brand-board-studio/
    steps:
      - name: Checkout Brand Board Studio
        uses: actions/checkout@v4

      - name: Checkout existing published AFTR website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Brand Board Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Brand Board Studio
        run: npm run build

      - name: Merge compiled app without overwriting AFTR
        run: |
          rm -rf _site/.git
          rm -rf _site/brand-board-studio
          mkdir -p _site/brand-board-studio
          cp -R dist/. _site/brand-board-studio/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/aftr-nightclub/index.html
          test -f _site/brand-board-studio/index.html
          test -d _site/brand-board-studio/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
